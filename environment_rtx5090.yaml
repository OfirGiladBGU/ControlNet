name: control
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.23.1
  - pip:
      # Install OpenCV contrib from a supported series
      - opencv-contrib-python>=4.7,<4.9
      # or, to avoid GUI deps:
      # - opencv-contrib-python-headless>=4.7,<4.9

      # Keep the rest as-is
      - gradio==3.16.2
      - albumentations==1.3.0
      - imageio==2.9.0
      - imageio-ffmpeg==0.4.2
      - pytorch-lightning==1.5.0
      - omegaconf==2.1.1
      - "test-tube>=0.7.5"
      - streamlit==1.12.1
      - einops==0.3.0
      - transformers==4.19.2
      - webdataset==0.2.5
      - kornia==0.6
      - open_clip_torch==2.0.2
      - "invisible-watermark>=0.1.5"
      - streamlit-drawable-canvas==0.8.0
      - torchmetrics==0.6.0
      - timm==0.6.12
      - addict==2.4.0
      - yapf==0.32.0
      - prettytable==3.6.0
      - safetensors==0.2.7
      - basicsr==1.4.2

# Install seperately to ensure compatibility
# pip3 install torch torchvision --index-url https://download.pytorch.org/whl/cu128
# [Optional] pip install xformers
# Reinstall numpy=1.23.1 and igonre compatibility issues